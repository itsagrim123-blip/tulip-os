<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tulip OS</title>
    <link rel="stylesheet" href="css/desktop.css">
    <link rel="stylesheet" href="css/taskbar.css">
    <link rel="stylesheet" href="css/windows.css">
    <link rel="stylesheet" href="css/explorer.css">
    <link rel="stylesheet" href="css/browser.css">
    <link rel="stylesheet" href="css/paint.css">
    <link rel="stylesheet" href="css/calculator.css">
    <link rel="stylesheet" href="css/notepad.css">
    <link rel="stylesheet" href="css/notifications.css">
    <link rel="stylesheet" href="css/store.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/terminal.css">
    <link rel="stylesheet" href="css/taskManager.css">
    <link rel="stylesheet" href="css/imageViewer.css">
    <link rel="stylesheet" href="css/archive.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/weather.css">
    <link rel="stylesheet" href="css/flappy.css">
    <link rel="stylesheet" href="css/apps-extra.css">
    <link rel="stylesheet" href="css/app-ui.css?v=20260803-update-history">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="boot-screen">
        <div class="boot-logo">🌷</div>
        <h1>Tulip OS</h1>
        <p id="boot-status">Initializing System...</p>
        <div class="boot-bar"><div id="boot-progress"></div></div>
    </div>

    <main id="desktop" class="hidden">
        <div id="contextMenu" class="context-menu">
            <div id="newFolderBtn">📁 New Folder</div>
            <div id="newFileBtn">📄 New File</div>
            <hr>
            <div id="pasteBtn">📋 Paste</div>
            <div id="refreshBtn">🔄 Refresh</div>
            <div id="propertiesBtn">⚙ Properties</div>
            <hr>
            <div id="openBtn">Open</div>
            <div id="openWithBtn">Open With</div>
            <div id="renameBtn">Rename</div>
            <div id="deleteBtn">Delete</div>
        </div>

        <div id="wallpaper-layer" aria-hidden="true"></div>
        <div id="wallpaper-overlay"></div>
        <div id="desktop-icons"></div>
        <button type="button" id="desktop-weather" class="weather-widget" aria-label="Open Weather"><span data-weather-icon>☀️</span><span><strong data-weather-temp>--°</strong><small data-weather-place>Weather</small></span></button>
        <div id="windows"></div>

        <div id="desktopMenu" hidden>
            <button type="button" data-desktop-action="wallpaper">🖼 Change Wallpaper</button>
            <hr>
            <button type="button" data-desktop-action="lock">🔒 Lock</button>
        </div>

        <div id="start-menu" class="hidden">
            <div class="start-header">
                <h2>🌷 Tulip OS</h2>
                <p>Future starts here.</p>
            </div>
            <div class="start-apps">
                <button type="button" class="start-app" data-app="explorer">📁 Explorer</button>
                <button type="button" class="start-app" data-app="paint">🎨 Paint</button>
                <button type="button" class="start-app" data-app="notepad">📝 Notepad</button>
                <button type="button" class="start-app" data-app="calculator">🧮 Calculator</button>
                <button type="button" class="start-app" data-app="browser">🌐 Browser</button>
                <button type="button" class="start-app" data-app="calendar">🗓️ Calendar</button>
                <button type="button" class="start-app" data-app="storage-manager">💾 Storage</button>
                <button type="button" class="start-app" data-app="display-settings">🖥️ Display</button>
                <button type="button" class="start-app" data-app="pdf-viewer">📄 PDF Viewer</button>
                <button type="button" class="start-app" data-app="wallpaper-manager">🖼️ Wallpaper</button>
                <button type="button" class="start-app" data-app="update-center">⬆ Update Center</button>
                <button type="button" class="start-app" data-app="settings">⚙️ Settings</button>
            </div>
        </div>

        <div id="lockScreen" hidden>
            <div id="lockClock">00:00</div>
            <button type="button" id="unlock-button">Unlock</button>
        </div>

        <footer id="taskbar">
            <div class="task-left"><button type="button" id="start-button" aria-label="Open Start menu">🌷</button></div>
            <div id="task-center"></div>
            <div class="task-right"><button type="button" id="taskbar-weather" class="taskbar-weather" aria-label="Open Weather"><span data-weather-icon>☀️</span><span data-weather-temp>--°</span></button><span id="clock">00:00</span></div>
        </footer>
    </main>

    <script defer src="js/boot.js"></script>
    <script defer src="js/filesystem.js"></script>
    <script defer src="js/users.js"></script>
    <script defer src="apps/imageViewer.js"></script>
    <script defer src="apps/fileExplorer.js"></script>
    <script defer src="js/notifications.js"></script>
    <script defer src="js/soundManager.js"></script>
    <script defer src="js/wallpaper.js"></script>
    <script defer src="js/weather.js"></script>
    <script defer src="js/lockscreen.js"></script>
    <script defer src="js/taskbar.js"></script>
    <script defer src="js/systemServices.js"></script>
    <script defer src="js/windowManager.js"></script>
    <script defer src="js/desktop.js"></script>
    <script defer src="js/browser.js"></script>
    <script defer src="js/paint.js"></script>
    <script defer src="js/calculator.js"></script>
    <script defer src="js/notepad.js"></script>
    <script defer src="apps/settings.js"></script>
    <script defer src="apps/terminal.js"></script>
    <script defer src="apps/archiveManager.js"></script>
    <script defer src="apps/taskManager.js"></script>
    <script defer src="apps/camera.js"></script>
    <script defer src="apps/clock.js"></script>
    <script defer src="apps/mediaPlayer.js"></script>
    <script defer src="apps/calendar.js?v=20260803"></script>
    <script defer src="apps/storageManager.js?v=20260803"></script>
    <script defer src="apps/displaySettings.js?v=20260803"></script>
    <script defer src="apps/pdfViewer.js?v=20260803"></script>
    <script defer src="apps/wallpaperManager.js?v=20260803"></script>
    <script defer src="js/updateManager.js?v=20260803-update-history"></script>
    <script defer src="apps/updateCenter.js?v=20260803-update-history"></script>
    <script defer src="apps/flappyBird.js"></script>
    <script defer src="js/packageManager.js"></script>
    <script defer src="js/appSdk.js"></script>
    <script defer src="js/tulipStore.js"></script>
    <script defer src="js/main.js?v=20260803"></script>
</body>
</html>
